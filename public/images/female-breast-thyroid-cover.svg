<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">女性体检数据中的乳腺结节与甲状腺结节分析</title>
  <desc id="desc">医学数据分析封面，包含体检记录、超声检查和统计图表元素。</desc>
  <rect width="1200" height="675" fill="#f6f7f4"/>
  <rect x="70" y="72" width="1060" height="532" rx="8" fill="#ffffff" stroke="#dfe5df" stroke-width="2"/>
  <rect x="70" y="72" width="1060" height="96" rx="8" fill="#e7f2ef"/>
  <text x="110" y="128" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#202426">女性体检数据分析</text>
  <text x="110" y="198" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="48" font-weight="800" fill="#127c72">乳腺结节 × 甲状腺结节</text>
  <text x="112" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#6b7278">共检出特征、相关因素与论文写作记录</text>

  <g transform="translate(110 308)">
    <rect width="220" height="172" rx="8" fill="#ffffff" stroke="#dfe5df" stroke-width="2"/>
    <text x="22" y="44" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7278">乳腺结节检出率</text>
    <text x="22" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#c24739">51.0%</text>
    <line x1="22" y1="128" x2="198" y2="128" stroke="#dfe5df" stroke-width="2"/>
    <text x="22" y="154" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7278">2024 年女性体检记录</text>
  </g>

  <g transform="translate(370 308)">
    <rect width="220" height="172" rx="8" fill="#ffffff" stroke="#dfe5df" stroke-width="2"/>
    <text x="22" y="44" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7278">甲状腺结节检出率</text>
    <text x="22" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#127c72">47.5%</text>
    <line x1="22" y1="128" x2="198" y2="128" stroke="#dfe5df" stroke-width="2"/>
    <text x="22" y="154" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7278">超声体检诊断字段</text>
  </g>

  <g transform="translate(630 308)">
    <rect width="220" height="172" rx="8" fill="#ffffff" stroke="#dfe5df" stroke-width="2"/>
    <text x="22" y="44" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7278">二者共检出率</text>
    <text x="22" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#202426">26.9%</text>
    <line x1="22" y1="128" x2="198" y2="128" stroke="#dfe5df" stroke-width="2"/>
    <text x="22" y="154" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7278">乳腺 + 甲状腺</text>
  </g>

  <g transform="translate(900 284)">
    <rect x="0" y="0" width="170" height="220" rx="8" fill="#ffffff" stroke="#dfe5df" stroke-width="2"/>
    <line x1="34" y1="48" x2="34" y2="180" stroke="#dfe5df" stroke-width="2"/>
    <line x1="34" y1="180" x2="144" y2="180" stroke="#dfe5df" stroke-width="2"/>
    <rect x="52" y="112" width="18" height="68" fill="#127c72"/>
    <rect x="82" y="88" width="18" height="92" fill="#c24739"/>
    <rect x="112" y="56" width="18" height="124" fill="#202426"/>
    <text x="28" y="34" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" fill="#6b7278">年龄分层</text>
  </g>

  <g transform="translate(110 535)">
    <circle cx="10" cy="10" r="6" fill="#127c72"/>
    <text x="28" y="16" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7278">Logistic 回归</text>
    <circle cx="180" cy="10" r="6" fill="#c24739"/>
    <text x="198" y="16" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7278">森林图</text>
    <circle cx="324" cy="10" r="6" fill="#202426"/>
    <text x="342" y="16" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7278">医学论文草稿</text>
  </g>
</svg>
