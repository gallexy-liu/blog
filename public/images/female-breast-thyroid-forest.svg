<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">乳腺结节与甲状腺结节相关因素森林图</title>
  <desc id="desc">展示乳腺结节、甲状腺结节和二者共检出相关因素的 Logistic 回归 OR 与 95% 置信区间。</desc>
  <rect width="1080" height="720" fill="#ffffff"/>
  <text x="54" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#202426">Logistic 回归森林图</text>
  <text x="54" y="78" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#6b7278">横轴为 OR（对数刻度）；方块为点估计，线段为 95%CI。虚线 OR=1 表示无统计学关联。</text>

  <line x1="380" y1="118" x2="900" y2="118" stroke="#dfe5df" stroke-width="2"/>
  <line x1="380" y1="118" x2="380" y2="600" stroke="#dfe5df"/>
  <line x1="536.5" y1="118" x2="536.5" y2="600" stroke="#127c72" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="900" y1="118" x2="900" y2="600" stroke="#dfe5df"/>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6b7278" text-anchor="middle">
    <line x1="380" y1="600" x2="900" y2="600" stroke="#dfe5df" stroke-width="2"/>
    <line x1="380" y1="594" x2="380" y2="606" stroke="#dfe5df"/>
    <line x1="471.6" y1="594" x2="471.6" y2="606" stroke="#dfe5df"/>
    <line x1="536.5" y1="594" x2="536.5" y2="606" stroke="#127c72"/>
    <line x1="628.1" y1="594" x2="628.1" y2="606" stroke="#dfe5df"/>
    <line x1="693.1" y1="594" x2="693.1" y2="606" stroke="#dfe5df"/>
    <line x1="784.6" y1="594" x2="784.6" y2="606" stroke="#dfe5df"/>
    <line x1="900" y1="594" x2="900" y2="606" stroke="#dfe5df"/>
    <text x="380" y="628">0.5</text>
    <text x="471.6" y="628">0.75</text>
    <text x="536.5" y="628">1</text>
    <text x="628.1" y="628">1.5</text>
    <text x="693.1" y="628">2</text>
    <text x="784.6" y="628">3</text>
    <text x="900" y="628">5</text>
  </g>
  <text x="640" y="664" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6b7278" text-anchor="middle">OR（log scale）</text>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#202426">
    <text x="54" y="122" font-weight="700">A. 乳腺结节与甲状腺结节互相关联</text>
    <text x="950" y="122" font-size="14" fill="#6b7278" text-anchor="middle">OR (95%CI)</text>

    <text x="74" y="165">甲状腺结节 → 乳腺结节</text>
    <line x1="568.1" y1="160" x2="666.8" y2="160" stroke="#127c72" stroke-width="3"/>
    <rect x="611.3" y="154" width="12" height="12" fill="#127c72"/>
    <text x="950" y="165" text-anchor="middle">1.43 (1.15-1.78)</text>

    <text x="74" y="208">乳腺结节 → 甲状腺结节</text>
    <line x1="568.1" y1="203" x2="666.8" y2="203" stroke="#127c72" stroke-width="3"/>
    <rect x="611.3" y="197" width="12" height="12" fill="#127c72"/>
    <text x="950" y="208" text-anchor="middle">1.43 (1.15-1.78)</text>

    <line x1="54" y1="238" x2="1026" y2="238" stroke="#dfe5df"/>
    <text x="54" y="278" font-weight="700">B. 乳腺结节与甲状腺结节共检出相关因素</text>

    <text x="74" y="322">年龄，每增加 10 岁</text>
    <line x1="573.9" y1="317" x2="645.5" y2="317" stroke="#c24739" stroke-width="3"/>
    <rect x="603.3" y="311" width="12" height="12" fill="#c24739"/>
    <text x="950" y="322" text-anchor="middle">1.38 (1.18-1.62)</text>

    <text x="74" y="365">BMI，每增加 1 kg/m²</text>
    <line x1="520.1" y1="360" x2="536.5" y2="360" stroke="#6b7278" stroke-width="3"/>
    <rect x="521.3" y="354" width="12" height="12" fill="#6b7278"/>
    <text x="950" y="365" text-anchor="middle">0.96 (0.93-1.00)</text>

    <text x="74" y="408">高血压</text>
    <line x1="697.5" y1="403" x2="865.9" y2="403" stroke="#c24739" stroke-width="3"/>
    <rect x="775.6" y="397" width="12" height="12" fill="#c24739"/>
    <text x="950" y="408" text-anchor="middle">2.96 (2.04-4.30)</text>

    <text x="74" y="451">高脂血症</text>
    <line x1="564.1" y1="446" x2="690.8" y2="446" stroke="#c24739" stroke-width="3"/>
    <rect x="622.1" y="440" width="12" height="12" fill="#c24739"/>
    <text x="950" y="451" text-anchor="middle">1.50 (1.13-1.98)</text>

    <text x="74" y="494">高尿酸血症</text>
    <line x1="446.1" y1="489" x2="670.5" y2="489" stroke="#6b7278" stroke-width="3"/>
    <rect x="552.1" y="483" width="12" height="12" fill="#6b7278"/>
    <text x="950" y="494" text-anchor="middle">1.10 (0.67-1.81)</text>

    <text x="74" y="537">血糖升高</text>
    <line x1="401.5" y1="532" x2="738.0" y2="532" stroke="#6b7278" stroke-width="3"/>
    <rect x="564.1" y="526" width="12" height="12" fill="#6b7278"/>
    <text x="950" y="537" text-anchor="middle">1.16 (0.55-2.44)</text>

    <text x="74" y="580">子宫肌瘤</text>
    <line x1="512.7" y1="575" x2="659.0" y2="575" stroke="#6b7278" stroke-width="3"/>
    <rect x="579.1" y="569" width="12" height="12" fill="#6b7278"/>
    <text x="950" y="580" text-anchor="middle">1.24 (0.90-1.72)</text>
  </g>

  <text x="54" y="696" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#6b7278">注：A 为多因素调整模型；B 为以二者共检出为因变量的多因素模型。模型调整项见正文。</text>
</svg>
